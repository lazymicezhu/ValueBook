name: ValueBook
options:
  bundleIdPrefix: com.lazymice
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 2R4WYUF984
    CODE_SIGN_STYLE: Automatic
    # 版本号由 tools/release.sh 维护：MARKETING_VERSION 是对外版本，CURRENT_PROJECT_VERSION 每打一次 ipa 加 1
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  ValueBook:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - ValueBook/Sources
    info:
      path: ValueBook/Info.plist
      properties:
        CFBundleDisplayName: 价值账本
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 同步服务地址，来自 Config/Secrets.xcconfig
        SyncURL: https://$(SYNC_HOST)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.lazymice.valuebook.backup
            UTTypeDescription: 价值账本数据包
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [vbbackup]
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV 账单
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.comma-separated-values-text
              - public.tab-separated-values-text
              - public.plain-text
              - public.text
              - public.utf8-plain-text
              - public.delimited-values-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazymice.valuebook
        PRODUCT_NAME: ValueBook
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
